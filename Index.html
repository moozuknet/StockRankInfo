                       onchange="toggleBotEnabled('${botId}', this.checked)"

                <span>諛쒖넚 ?쒖꽦??/span>

              ${telegramBotsList.length > 1 ? `
                <button type="button" onclick="removeTelegramBot('${botId}')" title="遊???젣" class="p-1.5 text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg transition text-xs cursor-pointer">

            <div class="space-y-1">
              <label class="block text-[11px] font-semibold text-slate-300">

    function syncStateFromDom() {
      telegramBotsList = telegramBotsList.map(bot => {
        const nameEl = document.getElementById(`botName_${bot.id}`);
        const tokenEl = document.getElementById(`botToken_${bot.id}`);
        const chatIdEl = document.getElementById(`botChatId_${bot.id}`);
        const enabledEl = document.getElementById(`botEnabled_${bot.id}`);
        return {
          id: bot.id,
          name: nameEl ? nameEl.value.trim() : (bot.name || ''),
          token: tokenEl ? tokenEl.value.trim() : (bot.token || ''),
          chatId: chatIdEl ? chatIdEl.value.trim() : (bot.chatId || ''),
          enabled: enabledEl ? enabledEl.checked : (bot.enabled !== false)
        };
      });
    }

    function updateBotField(botId, field, value) {
      const b = telegramBotsList.find(item => item.id === botId);
      if (b) {
        b[field] = value.trim();
      }

    function toggleBotEnabled(botId, isChecked) {
      const b = telegramBotsList.find(item => item.id === botId);

        b.enabled = isChecked;

          card.className = 'p-4 rounded-xl border transition-all bg-slate-900/80 border-slate-700/80 space-y-3.5';

          card.className = 'p-4 rounded-xl border transition-all bg-slate-900/40 border-slate-800/80 opacity-70 space-y-3.5';

        const enabledCount = telegramBotsList.filter(item => item.enabled !== false).length;

    function handleTestSingleBot(botId) {
      syncStateFromDom();
      const bot = telegramBotsList.find(b => b.id === botId);
      if (!bot) return;
      
      const token = bot.token.trim();
      const chatId = bot.chatId.trim();
      const botName = bot.name.trim() || '遊?;
      
      if (!token || !chatId) {
        showToast('warning', '?낅젰 ?뺤씤', `[${botName}]??Bot Token怨?Chat ID瑜?紐⑤몢 ?낅젰?댁＜?몄슂.`);
        return;
      }
      
      const btn = document.getElementById(`btnTestBot_${botId}`);
      setButtonLoading(btn, true, '諛쒖넚 以?..');
      
      google.script.run
        .withSuccessHandler((res) => {
          setButtonLoading(btn, false, '<i class="fa-solid fa-paper-plane text-[10px] mr-1"></i> ??遊뉗쑝濡??뚯뒪??諛쒖넚');

          setButtonLoading(btn, false, '<i class="fa-solid fa-paper-plane text-[10px] mr-1"></i> ??遊뉗쑝濡??뚯뒪??諛쒖넚');
          onApiError(err);
        })
        .testTelegram(token, chatId, botName);
    }

    function handleTestAllTelegram() {
      syncStateFromDom();
      const activeBots = telegramBotsList.filter(b => b.enabled !== false && b.token && b.chatId);
      
      if (activeBots.length === 0) {
        showToast('warning', '諛쒖넚 ????놁쓬', '?쒖꽦?붾릺怨??좏겙 諛?Chat ID媛 ?낅젰??遊뉗씠 ?놁뒿?덈떎.');
        return;
      }
      
      const btn = document.getElementById('btnTestAllTelegram');
      setButtonLoading(btn, true, `?꾩껜 ${activeBots.length}媛?遊?諛쒖넚 以?..`);
      
      let completed = 0;
      let successes = 0;
      let fails = 0;
      
      activeBots.forEach(bot => {
        google.script.run
          .withSuccessHandler((res) => {
            completed++;
            if (res.success) successes++;
            else fails++;
            
            if (completed === activeBots.length) {
              setButtonLoading(btn, false, '<i class="fa-solid fa-paper-plane mr-1"></i> ?쒖꽦 遊??꾩껜 ?뚯뒪??諛쒖넚');
              if (fails === 0) {
                showToast('success', '?꾩껜 ?뚯뒪???깃났', `?쒖꽦?붾맂 ${successes}媛?遊?紐⑤몢?먭쾶 ?뚯뒪??硫붿떆吏媛 諛쒖넚?섏뿀?듬땲??`);
              } else {
                showToast('warning', '?쇰? ?뚯뒪???꾨즺', `?깃났: ${successes}媛? ?ㅽ뙣: ${fails}媛?);
              }
            }
          })
          .withFailureHandler((err) => {
            completed++;
            fails++;
            if (completed === activeBots.length) {
              setButtonLoading(btn, false, '<i class="fa-solid fa-paper-plane mr-1"></i> ?쒖꽦 遊??꾩껜 ?뚯뒪??諛쒖넚');
              showToast('warning', '?뚯뒪???꾨즺', `?깃났: ${successes}媛? ?ㅽ뙣: ${fails}媛?);
            }
          })
          .testTelegram(bot.token.trim(), bot.chatId.trim(), bot.name.trim());
      });
    }

    function onSettingsLoaded(config) {
      if (!config) return;
      
      if (Array.isArray(config.telegramBots) && config.telegramBots.length > 0) {
        renderTelegramBots(config.telegramBots);
      } else if (config.telegramToken || config.telegramChatId) {
        renderTelegramBots([{
          id: 'bot_1',
          name: '湲곕낯 遊?,
          token: config.telegramToken || '',
          chatId: config.telegramChatId || '',
          enabled: true
        }]);
      } else {
        renderTelegramBots([{
          id: 'bot_1',
          name: '湲곕낯 遊?,
          token: '',
          chatId: '',
          enabled: true
        }]);
      }
      
      document.getElementById('krxMain').checked = !!config.krxMain;
      document.getElementById('krxNxt').checked = !!config.krxNxt;
      document.getElementById('usMain').checked = !!config.usMain;
      document.getElementById('skipHolidays').checked = (config.skipHolidays !== false);
      
      document.getElementById('topN').value = config.topN || 20;
      
      document.getElementById('compare1d').checked = !!config.compare1d;
      document.getElementById('compare5d').checked = !!config.compare5d;
      document.getElementById('compare1m').checked = !!config.compare1m;
      document.getElementById('compare3m').checked = !!config.compare3m;
      document.getElementById('compare1y').checked = !!config.compare1y;
      
      document.getElementById('showPastCap').checked = !!config.showPastCap;
      document.getElementById('showChangePercent').checked = !!config.showChangePercent;
      document.getElementById('showIcons').checked = !!config.showIcons;
      document.getElementById('showLinks').checked = !!config.showLinks;
      document.getElementById('includeAnalystSummary').checked = !!config.includeAnalystSummary;
      
      showStatus('ready', '?뺤긽 ?곌껐??);
    }

    function collectFormConfig() {
      syncStateFromDom();
      
      const primaryBot = telegramBotsList[0] || {};
      
      return {
        telegramBots: telegramBotsList,
        telegramToken: primaryBot.token || '',
        telegramChatId: primaryBot.chatId || '',
        krxMain: document.getElementById('krxMain').checked,
        krxNxt: document.getElementById('krxNxt').checked,
        usMain: document.getElementById('usMain').checked,
        skipHolidays: document.getElementById('skipHolidays').checked,
        topN: parseInt(document.getElementById('topN').value, 10) || 20,
        compare1d: document.getElementById('compare1d').checked,
        compare5d: document.getElementById('compare5d').checked,
        compare1m: document.getElementById('compare1m').checked,
        compare3m: document.getElementById('compare3m').checked,
        compare1y: document.getElementById('compare1y').checked,
        showPastCap: document.getElementById('showPastCap').checked,
        showChangePercent: document.getElementById('showChangePercent').checked,
        showIcons: document.getElementById('showIcons').checked,
        showLinks: document.getElementById('showLinks').checked,
        includeAnalystSummary: document.getElementById('includeAnalystSummary').checked
      };
    }

    function handleSaveSettings() {
      const config = collectFormConfig();
      const btn = document.getElementById('btnSave');
      
      setButtonLoading(btn, true, '???以?..');
      
      google.script.run
        .withSuccessHandler((res) => {
          setButtonLoading(btn, false, '<i class="fa-solid fa-floppy-disk text-sky-400 mr-1"></i> ?뮶 ?ㅼ젙 ???(?⑤룆)');
          if (res.success) {
            showToast('success', '?ㅼ젙 ????꾨즺', res.message);
          } else {
            showToast('error', '????ㅻ쪟', res.message);
          }
        })
        .withFailureHandler((err) => {
          setButtonLoading(btn, false, '<i class="fa-solid fa-floppy-disk text-sky-400 mr-1"></i> ?뮶 ?ㅼ젙 ???(?⑤룆)');
          onApiError(err);
        })
        .saveSettings(config);
    }

    function handleSyncTriggers() {
      const btn = document.getElementById('btnSyncTriggers');
      setButtonLoading(btn, true, '?몃━嫄??숆린??以?..');
      
      const config = collectFormConfig();
      google.script.run
        .withSuccessHandler(() => {
          google.script.run
            .withSuccessHandler((res) => {
              setButtonLoading(btn, false, '<i class="fa-solid fa-clock mr-1"></i> ???ㅼ?以??몃━嫄??숆린??);
              if (res.success) {
                showToast('success', '?ㅼ?以??숆린???꾨즺', res.message);
              } else {
                showToast('error', '?숆린???ㅻ쪟', res.message);
              }
            })
            .withFailureHandler((err) => {
              setButtonLoading(btn, false, '<i class="fa-solid fa-clock mr-1"></i> ???ㅼ?以??몃━嫄??숆린??);
              onApiError(err);
            })
            .syncTriggersAction();
        })
        .saveSettings(config);
    }

    function handlePreviewReport(marketType, btnId) {
      const btn = document.getElementById(btnId);
      const originalHtml = btn.innerHTML;
      
      setButtonLoading(btn, true, '?곗씠??議고쉶 以?..');
      
      const config = collectFormConfig();
      google.script.run
        .withSuccessHandler(() => {
          google.script.run
            .withSuccessHandler((res) => {
              setButtonLoading(btn, false, originalHtml);
              if (res.success) {
                currentPreviewMarketType = marketType;
                openPreviewModal(res);
              } else {
                showToast('error', '誘몃━蹂닿린 ?ㅽ뙣', res.message);
              }
            })
            .withFailureHandler((err) => {
              setButtonLoading(btn, false, originalHtml);
              onApiError(err);
            })
            .previewReport(marketType);
        })
        .saveSettings(config);
    }

    function openPreviewModal(res) {
      document.getElementById('modalTitle').innerText = res.sessionTitle;
      document.getElementById('modalSubtitle').innerText = `?곸쐞 ${res.stockCount}媛?醫낅ぉ ?ㅼ떆媛??섏쭛 寃곌낵`;
      document.getElementById('modalCharBadge').innerText = `${res.charCount.toLocaleString()}??;
      
      document.getElementById('previewRenderView').innerHTML = res.htmlMessage;
      document.getElementById('previewRawView').value = res.htmlMessage;
      
      switchPreviewTab('render');
      document.getElementById('previewModal').classList.remove('hidden');
    }

    function closePreviewModal() {
      document.getElementById('previewModal').classList.add('hidden');
    }

    function switchPreviewTab(tab) {
      const renderBtn = document.getElementById('tabRenderBtn');
      const rawBtn = document.getElementById('tabRawBtn');
      const renderView = document.getElementById('previewRenderView');
      const rawView = document.getElementById('previewRawView');
      
      if (tab === 'render') {
        renderBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-sky-600 text-white cursor-pointer';
        rawBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:text-slate-200 cursor-pointer';
        renderView.classList.remove('hidden');
        rawView.classList.add('hidden');
      } else {
        rawBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-sky-600 text-white cursor-pointer';
        renderBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:text-slate-200 cursor-pointer';
        renderView.classList.remove('hidden');
        rawView.classList.add('hidden');
      }
    }

    function copyPreviewText() {
      const text = document.getElementById('previewRawView').value;
      navigator.clipboard.writeText(text).then(() => {
        showToast('success', '蹂듭궗 ?꾨즺', '誘몃━蹂닿린 ?붾젅洹몃옩 HTML 硫붿떆吏媛 ?대┰蹂대뱶??蹂듭궗?섏뿀?듬땲??');
      }).catch(err => {
        showToast('error', '蹂듭궗 ?ㅽ뙣', err.toString());
      });
    }

    function sendModalReport() {
      if (!currentPreviewMarketType) return;
      
      let fnName = 'sendManualKrxMainReport';
      let label = '援?궡 ?뺢퇋??;
      if (currentPreviewMarketType === 'krxNxt') {
        fnName = 'sendManualKrxNxtReport';
        label = '援?궡 NXT??;
      } else if (currentPreviewMarketType === 'usMain') {
        fnName = 'sendManualUsReport';
        label = '誘멸뎅 留덇컧??;
      }
      
      closePreviewModal();
      handleManualSend(fnName, 'btnSave', label);
    }

    function handleManualSend(fnName, btnId, label) {
      const btn = document.getElementById(btnId);
      const originalHtml = btn ? btn.innerHTML : '';
      
      if (btn) setButtonLoading(btn, true, `${label} 諛쒖넚 以?..`);
      
      google.script.run
        .withSuccessHandler((res) => {
          if (btn) setButtonLoading(btn, false, originalHtml);
          if (res.success) {
            showToast('success', `${label} 諛쒖넚 ?깃났`, res.message);
          } else {
            showToast('error', `${label} 諛쒖넚 ?ㅽ뙣`, res.message);
          }
        })
        .withFailureHandler((err) => {
          if (btn) setButtonLoading(btn, false, originalHtml);
          onApiError(err);
        })[fnName]();
    }

    function showStatus(type, text) {
      const el = document.getElementById('connectionStatus');
      if (type === 'loading') {
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span><span>${text}</span>`;
      } else if (type === 'ready') {
        el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span class="text-emerald-300 font-medium">${text}</span>`;
      }
    }

    function setButtonLoading(btn, isLoading, textOrHtml) {
      if (!btn) return;
      if (isLoading) {
        btn.disabled = true;
        btn.classList.add('opacity-75', 'cursor-not-allowed');
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> ${textOrHtml}`;
      } else {
        btn.disabled = false;
        btn.classList.remove('opacity-75', 'cursor-not-allowed');
        btn.innerHTML = textOrHtml;
      }
    }

    function showToast(type, title, message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      let borderCol = 'border-sky-500';
      let icon = 'fa-info-circle text-sky-400';
      
      if (type === 'success') {
        borderCol = 'border-emerald-500';
        icon = 'fa-circle-check text-emerald-400';
      } else if (type === 'error') {
        borderCol = 'border-rose-500';
        icon = 'fa-circle-xmark text-rose-400';
      } else if (type === 'warning') {
        borderCol = 'border-amber-500';
        icon = 'fa-triangle-exclamation text-amber-400';
      }

      toast.className = `pointer-events-auto p-4 rounded-xl bg-slate-900/95 border ${borderCol} shadow-2xl text-slate-100 transition-all transform translate-y-2 opacity-0 flex items-start gap-3`;
      toast.innerHTML = `
        <i class="fa-solid ${icon} text-lg mt-0.5"></i>
        <div class="flex-1 text-xs">
          <p class="font-bold text-sm text-white mb-0.5">${escapeHtml(title)}</p>
          <p class="text-slate-300 leading-relaxed">${escapeHtml(message).replace(/\n/g, '<br>')}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark"></i>
        </button>
      `;

      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        if (toast.parentElement) {
          toast.classList.add('opacity-0', 'translate-y-2');
          setTimeout(() => toast.remove(), 300);
        }
      }, 5000);
    }

    function togglePasswordVisibility(inputId, eyeIconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(eyeIconId);
      if (!input || !icon) return;
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash text-xs';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye text-xs';
      }
    }

    function onApiError(err) {
      showToast('error', '?쒕쾭 ?듭떊 ?ㅻ쪟', err.message || err.toString());
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.toString()
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
